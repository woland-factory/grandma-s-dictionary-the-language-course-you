server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check for the container / proxy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Runtime config must never be cached, so a redeploy with new env applies
    # immediately.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed build assets are safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve the app shell.
    location / {
        try_files $uri /index.html;
    }
}
